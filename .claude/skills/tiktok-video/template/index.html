<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      :root {
        --bg: #1a202d;
        --bg-deep: #0d1119;
        --wall: #283043;
        --ink: #f4efe4;
        --grey: #8d93a1;
        --orange: #f4a62a;
        --orange-dark: #8f5a0f;
        --red: #e8412f;
        --red-dark: #7d1a10;
        --yellow: #f7c548;
        --green: #5f8f5c;
        --skin: #f1c7a0;
        --font-display: "Oswald", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg-deep);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        overflow: hidden;
      }
      /* ---- gemeinsame Bausteine aller Szenen ---- */
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .cam { position: absolute; inset: 0; transform-origin: 50% 45%; }
      .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .title {
        position: absolute; left: 0; width: 1080px; text-align: center;
        font-family: var(--font-display); font-weight: 700; text-transform: uppercase;
        font-size: 128px; line-height: 0.98; letter-spacing: 0.005em; color: var(--ink);
        text-shadow: 0 7px 0 rgba(0, 0, 0, 0.5), 0 0 46px rgba(0, 0, 0, 0.55);
      }
      .title .r { color: var(--red); text-shadow: 0 7px 0 var(--red-dark), 0 0 46px rgba(232, 65, 47, 0.35); }
      .title .o { color: var(--orange); text-shadow: 0 7px 0 var(--orange-dark), 0 0 46px rgba(244, 166, 42, 0.3); }
      .chip {
        display: inline-block; padding: 4px 24px 8px; border-radius: 10px;
        background: #14161c; color: var(--ink); font-family: var(--font-display);
        font-weight: 700; font-size: 54px; text-transform: uppercase; letter-spacing: 0.02em;
        border-bottom: 5px solid var(--red); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      .chip.o { background: var(--orange); color: #1d1405; border-bottom-color: var(--orange-dark); }
      .chip.r { background: var(--red); color: #fff; border-bottom-color: var(--red-dark); }
      .chip-row { position: absolute; left: 0; width: 1080px; text-align: center; }
      .ring { position: absolute; border-radius: 50%; border: 12px solid rgba(232, 65, 47, 0.8); }
      .dust { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 240, 220, 0.35); }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 90;
        pointer-events: none;
        opacity: 0.07;
        mix-blend-mode: overlay;
      }
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 89;
        pointer-events: none;
        background: radial-gradient(ellipse 75% 60% at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- Szenen -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="fact" data-composition-id="fact" data-composition-src="compositions/fact.html"
        data-start="5" data-duration="3.3" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="tag1" data-composition-id="tag1" data-composition-src="compositions/tag1.html"
        data-start="8.3" data-duration="3.8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="tag3" data-composition-id="tag3" data-composition-src="compositions/tag3.html"
        data-start="12.1" data-duration="3.95" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="tag5" data-composition-id="tag5" data-composition-src="compositions/tag5.html"
        data-start="16.05" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="wasser" data-composition-id="wasser" data-composition-src="compositions/wasser.html"
        data-start="20.05" data-duration="3.95" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="frage" data-composition-id="frage" data-composition-src="compositions/frage.html"
        data-start="24" data-duration="2.1" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="26.1" data-duration="3.9" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>

      <!-- Overlays -->
      <div id="hud" data-composition-id="hud" data-composition-src="compositions/hud.html"
        data-start="8.3" data-duration="15.7" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 40"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="30" data-track-index="3" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 50"></div>

      <div id="vignette" class="clip" data-start="0" data-duration="30" data-track-index="4" data-layout-ignore></div>
      <svg id="grain" class="clip" data-start="0" data-duration="30" data-track-index="4" data-layout-ignore
        viewBox="0 0 1080 1920" preserveAspectRatio="none">
        <filter id="grain-f"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" /></filter>
        <rect width="1080" height="1920" filter="url(#grain-f)" />
      </svg>

      <!-- Ton -->
      <audio id="voice" class="clip" src="assets/voice.wav" data-start="0" data-duration="28.72" data-track-index="10" data-volume="1"></audio>
      <audio id="ambience" class="clip" src="assets/ambience.wav" data-start="0" data-duration="30" data-track-index="11" data-volume="0.9"></audio>

      <audio id="sfx-err" class="clip" src="assets/sfx/error.mp3" data-start="1.72" data-duration="1.62" data-track-index="16" data-volume="2.5"></audio>
      <audio id="sfx-w1" class="clip" src="assets/sfx/whoosh.mp3" data-start="1.79" data-duration="0.57" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-chaos" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="4.42" data-duration="2.12" data-track-index="13" data-volume="0.3"></audio>
      <audio id="sfx-w2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="4.84" data-duration="0.57" data-track-index="12" data-volume="0.25"></audio>
      <audio id="sfx-pop1" class="clip" src="assets/sfx/pop.mp3" data-start="6.9" data-duration="0.72" data-track-index="14" data-volume="0.9"></audio>
      <audio id="sfx-w3" class="clip" src="assets/sfx/whoosh.mp3" data-start="8.14" data-duration="0.57" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-pop2" class="clip" src="assets/sfx/pop.mp3" data-start="8.42" data-duration="0.72" data-track-index="14" data-volume="0.7"></audio>
      <audio id="sfx-pop3" class="clip" src="assets/sfx/pop.mp3" data-start="9.9" data-duration="0.72" data-track-index="14" data-volume="0.8"></audio>
      <audio id="sfx-w4" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="11.94" data-duration="0.57" data-track-index="12" data-volume="0.25"></audio>
      <audio id="sfx-click1" class="clip" src="assets/sfx/click-soft.mp3" data-start="12.15" data-duration="0.37" data-track-index="14" data-volume="1.2"></audio>
      <audio id="sfx-pop4" class="clip" src="assets/sfx/pop.mp3" data-start="13.75" data-duration="0.72" data-track-index="14" data-volume="0.8"></audio>
      <audio id="sfx-w5" class="clip" src="assets/sfx/whoosh.mp3" data-start="15.89" data-duration="0.57" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-click2" class="clip" src="assets/sfx/click-soft.mp3" data-start="16.1" data-duration="0.37" data-track-index="14" data-volume="1.2"></audio>
      <audio id="sfx-glitch" class="clip" src="assets/sfx/glitch-1.mp3" data-start="18.3" data-duration="2.64" data-track-index="13" data-volume="0.3"></audio>
      <audio id="sfx-out" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="19.5" data-duration="2.12" data-track-index="17" data-volume="0.28"></audio>
      <audio id="sfx-w6" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="19.89" data-duration="0.57" data-track-index="12" data-volume="0.22"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="20.6" data-duration="3.6" data-track-index="15" data-volume="0.18" data-fade-in="1.5"></audio>
      <audio id="sfx-w7" class="clip" src="assets/sfx/whoosh.mp3" data-start="23.84" data-duration="0.57" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-pop5" class="clip" src="assets/sfx/pop.mp3" data-start="25.15" data-duration="0.72" data-track-index="14" data-volume="0.8"></audio>
      <audio id="sfx-w8" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="25.94" data-duration="0.57" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-pop6" class="clip" src="assets/sfx/pop.mp3" data-start="27.1" data-duration="0.72" data-track-index="14" data-volume="0.8"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
